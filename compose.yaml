services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eliza
      POSTGRES_PASSWORD: eliza_local
      POSTGRES_DB: eliza
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eliza -d eliza']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
